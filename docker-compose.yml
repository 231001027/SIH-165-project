# Optional Docker deployment path.
#
# Default local-dev still works with SQLite (see backend/.env.example).
# This compose file runs Postgres + backend + frontend + local Ollama for
# bounded LLM explanation polish (RAG excerpts + structured fields only).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sifguard
      POSTGRES_PASSWORD: sifguard
      POSTGRES_DB: sifguard
    ports:
      - "5432:5432"
    volumes:
      - sifguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sifguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - sifguard_ollama:/root/.ollama

  ollama-init:
    image: curlimages/curl:8.5.0
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama..."
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        echo "Pulling llama3.2..."
        curl -sf http://ollama:11434/api/pull -d '{"name":"llama3.2"}'
        echo "Model llama3.2 ready."
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://sifguard:sifguard@postgres:5432/sifguard
      JWT_SECRET: change-this-secret-in-production-CHANGE-ME
      FRONTEND_URL: http://localhost:5173
      LLM_PROVIDER: ollama
      LLM_API_KEY: ollama
      LLM_MODEL: llama3.2
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  sifguard_pgdata:
  sifguard_ollama:
